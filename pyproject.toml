[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giveaways-tools"
version = "0.1.0"
description = "Gera códigos únicos de sorteio a partir de planilhas de participantes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[project.scripts]
gerador-codigos = "gerador_codigos.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gerador_codigos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]