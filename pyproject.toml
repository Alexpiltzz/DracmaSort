[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giveaways-tools"
version = "0.2.0"
description = "Gera códigos únicos de sorteio a partir de planilhas de participantes."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "Markdown>=3.8.2",
    "openpyxl>=3.1.5",
    "PyQt6>=6.9.1",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]

[project.scripts]
gerador-codigos = "code_gen.__main__:main"
gerador-interativo = "code_gen.main:main"
gerador-grafico = "gui.ui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/code_gen", "src/delivery", "src/gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
